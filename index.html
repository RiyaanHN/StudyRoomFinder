<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Room Finder</title>
  </head>
  <body>
    <header>
      <h1>Study Room Finder</h1>
      <div class="controls">
        <label>Day
          <select id="day"></select>
        </label>
        <label>Time
          <input id="time" type="time" />
        </label>
        <label>Min. capacity
          <input id="capacity" type="number" min="1" value="1" />
        </label>
        <button id="now" type="button">Now</button>
      </div>
    </header>
    <main>
      <aside>
        <p id="summary"></p>
        <ul id="list"></ul>
      </aside>
      <div id="map" aria-label="Map of rooms"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
